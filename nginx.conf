# Konfigurim nginx për SPA-në eTerminiUI (prapa Cloudflare Tunnel).
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # TLS-i mbyllet te Cloudflare; këtu vjen vetëm HTTP nga cloudflared.
    # IP-ja reale e vizitorit vjen te X-Forwarded-For / CF-Connecting-IP.
    log_format  tunnel '$http_cf_connecting_ip - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /var/log/nginx/access.log tunnel;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml font/woff font/woff2;

    # Endpoint për healthcheck-un e docker compose.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Asetet me hash në emër janë immutable — cache i gjatë.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html nuk duhet cache-uar, përndryshe deploy-i i ri nuk merret.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    off;
    }

    # Fallback i SPA-së: çdo rrugë e panjohur i dorëzohet React Router-it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Siguri bazë.
    add_header X-Content-Type-Options "nosniff"        always;
    add_header X-Frame-Options        "SAMEORIGIN"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
}
